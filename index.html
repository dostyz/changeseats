<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자리 바꾸기</title>

<style>

body {
  margin: 0;
  font-family: sans-serif;

  background-color: #d9d9d9;
  background-image: radial-gradient(#9e9e9e 2px, transparent 2px);
  background-size: 40px 40px;

  display: flex;
  flex-direction: column;
  align-items: center;
}

button {
  font-size: 30px;
  padding: 10px 30px;
  margin: 20px;
}

#board {

  display: grid;

  grid-template-columns:
    96px 96px 40px
    96px 96px 40px
    96px 96px;

  grid-template-rows: repeat(5, 80px);

  gap: 10px;
}

.seat {

  width: 96px;
  height: 80px;

  background: white;
  border: 3px solid black;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.num {
  font-size: 12px;
}

.name {
  font-size: 22px;
  font-weight: bold;
}

.empty {
  background: transparent;
  border: none;
}

#countdown {

  position: fixed;

  top: 40%;
  left: 50%;

  transform: translate(-50%, -50%);

  font-size: 180px;
  font-weight: bold;

  display: none;
}

</style>
</head>

<body>

<button onclick="startRandom()">랜덤 바꾸기</button>

<div id="board"></div>

<div id="countdown">3</div>

<script>


const names = [

"가서한",
"강다솔",
"강채원",
"고윤솔",
"김소리",
"김수아",
"노윤서",
"문채은",
"박민영",
"박한을",
"배재은",
"신예은",
"엄수정",
"원태령",
"유진명",
"이서은",
"이은선",
"이해인",
"임서현",
"장시연",
"전은주",
"최소현",
"한나연",
"홍민서"

];


const board = document.getElementById("board");

let seats = [];

for (let r = 0; r < 5; r++) {

  for (let c = 0; c < 8; c++) {

    let div = document.createElement("div");

    if (c === 2 || c === 5) {

      div.className = "seat empty";

    } else {

      div.className = "seat";
      seats.push(div);

    }

    board.appendChild(div);
  }
}


function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    let j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];
  }
}


function assignSeats() {

  let arr = [...names];

  shuffle(arr);

  seats.forEach((seat, i) => {

    seat.innerHTML = "";

    if (i < arr.length) {

      let num = document.createElement("div");
      num.className = "num";
      num.textContent = i + 1;

      let name = document.createElement("div");
      name.className = "name";
      name.textContent = arr[i];

      seat.appendChild(num);
      seat.appendChild(name);
    }

  });
}


function startRandom() {

  let cd = document.getElementById("countdown");

  let n = 3;

  cd.style.display = "block";
  cd.textContent = n;

  let timer = setInterval(() => {

    n--;

    if (n === 0) {

      clearInterval(timer);

      cd.style.display = "none";

      assignSeats();

    } else {

      cd.textContent = n;

    }

  }, 1000);

}

</script>

</body>
</html>
