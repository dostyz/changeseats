<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자리 바꾸기</title>

<style>

/* ===== 배경 (도트 크게) ===== */

body {
  margin: 0;
  font-family: sans-serif;

  background-color: #d9d9d9;
  background-image: radial-gradient(#9e9e9e 2px, transparent 2px);
  background-size: 40px 40px;

  display: flex;
  flex-direction: column;
  align-items: center;
}


/* ===== 버튼 ===== */

button {
  font-size: 30px;
  padding: 10px 30px;
  margin: 20px;
}


/* ===== 자리판 ===== */

#board {

  display: grid;

  /* 2칸 + 통로 + 2칸 + 통로 + 2칸 */

  grid-template-columns:
    80px 80px 40px
    80px 80px 40px
    80px 80px;

  grid-template-rows: repeat(5, 80px);

  gap: 10px;
}


/* ===== 자리 ===== */

.seat {

  width: 80px;
  height: 80px;

  background: white;
  border: 3px solid black;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 25px;
  font-weight: bold;
}


/* 통로 */

.empty {
  background: transparent;
  border: none;
}


/* ===== 카운트다운 ===== */

#countdown {

  position: fixed;

  top: 40%;
  left: 50%;

  transform: translate(-50%, -50%);

  font-size: 180px;
  font-weight: bold;

  display: none;
}

</style>
</head>



<body>

<button onclick="startRandom()">랜덤 바꾸기</button>

<div id="board"></div>

<div id="countdown">3</div>



<script>


const board = document.getElementById("board");

let seats = [];


/* ===== 자리 생성 ===== */

for (let r = 0; r < 5; r++) {

  for (let c = 0; c < 8; c++) {

    let div = document.createElement("div");

    if (c === 2 || c === 5) {

      div.className = "seat empty";

    } else {

      div.className = "seat";
      seats.push(div);

    }

    board.appendChild(div);
  }
}


/* ===== 섞기 ===== */

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    let j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];
  }
}


/* ===== 자리 배치 ===== */

function assignSeats() {

  let nums = [];

  for (let i = 1; i <= 24; i++) {
    nums.push(i);
  }

  shuffle(nums);

  seats.forEach((seat, i) => {

    if (i < 24) {
      seat.textContent = nums[i];
    } else {
      seat.textContent = "";
    }

  });
}


/* ===== 카운트다운 ===== */

function startRandom() {

  let cd = document.getElementById("countdown");

  let n = 3;

  cd.style.display = "block";
  cd.textContent = n;

  let timer = setInterval(() => {

    n--;

    if (n === 0) {

      clearInterval(timer);

      cd.style.display = "none";

      assignSeats();

    } else {

      cd.textContent = n;

    }

  }, 1000);

}


</script>

</body>
</html>
