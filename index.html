<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자리 바꾸기</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body {
  margin: 0;
  font-family: sans-serif;

  background-color: #d9d9d9;
  background-image: radial-gradient(#9e9e9e 2px, transparent 2px);
  background-size: 40px 40px;

  display: flex;
  flex-direction: column;
  align-items: center;
}

button {
  font-size: 20px;
  padding: 10px 20px;
  margin: 10px;
}

#board {

  display: grid;

  grid-template-columns:
    96px 96px 40px
    96px 96px 40px
    96px 96px;

  grid-template-rows: repeat(5, 80px);

  gap: 10px;
}

.seat {

  width: 96px;
  height: 80px;

  background: white;
  border: 3px solid black;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.num { font-size: 12px; }
.name { font-size: 22px; font-weight: bold; }

.empty {
  background: transparent;
  border: none;
}

#countdown {

  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 180px;
  font-weight: bold;
  display: none;
}

</style>
</head>

<body>

<button onclick="startRandom()">랜덤 바꾸기</button>
<button onclick="flipSeats()">자리표 변환</button>
<button onclick="savePDF()">저장</button>

<div id="board"></div>
<div id="countdown">3</div>

<script>


const students = [

{num:1,name:"가서한"},
{num:2,name:"강다솔"},
{num:3,name:"강채원"},
{num:4,name:"고윤솔"},
{num:5,name:"김소리"},
{num:6,name:"김수아"},
{num:7,name:"노윤서"},
{num:8,name:"문채은"},
{num:9,name:"박민영"},
{num:10,name:"박한을"},
{num:11,name:"배재은"},
{num:12,name:"신예은"},
{num:13,name:"엄수정"},
{num:14,name:"원태령"},
{num:15,name:"유진명"},
{num:16,name:"이서은"},
{num:17,name:"이은선"},
{num:18,name:"이해인"},
{num:19,name:"임서현"},
{num:20,name:"장시연"},
{num:21,name:"전은주"},
{num:22,name:"최소현"},
{num:23,name:"한나연"},
{num:24,name:"홍민서"}

];


const board = document.getElementById("board");

let seats = [];
let originalSeats = new Array(30).fill(null);
let flippedState = false;


/* 자리 생성 */

for (let r=0;r<5;r++){
 for(let c=0;c<8;c++){

  let div=document.createElement("div");

  if(c===2||c===5){
    div.className="seat empty";
  }else{
    div.className="seat";
    seats.push(div);
  }

  board.appendChild(div);
 }
}


/* 섞기 */

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
}


/* 그리기 */

function drawSeats(arr){

 seats.forEach((seat,i)=>{

  seat.innerHTML="";

  if(arr[i]){

   let num=document.createElement("div");
   num.className="num";
   num.textContent=arr[i].num;

   let name=document.createElement("div");
   name.className="name";
   name.textContent=arr[i].name;

   seat.appendChild(num);
   seat.appendChild(name);
  }

 });

}


/* 랜덤 */

function assignSeats(){

 let arr=[...students];
 shuffle(arr);

 let result=new Array(30).fill(null);

 for(let i=0;i<24;i++){
  result[i]=arr[i];
 }

 originalSeats=[...result];
 flippedState=false;

 drawSeats(result);
}


/* 반전 */

function flipSeats(){

 if(!flippedState){

  let rev=[...originalSeats].reverse();
  drawSeats(rev);
  flippedState=true;

 }else{

  drawSeats(originalSeats);
  flippedState=false;

 }

}


/* PDF 저장 */

async function savePDF(){

 const boardEl = document.getElementById("board");

 const canvas = await html2canvas(boardEl,{
  scale:2,
  backgroundColor:"#ffffff"
 });

 const img = canvas.toDataURL("image/png");

 const pdf = new window.jspdf.jsPDF({
  orientation:"landscape",
  unit:"mm",
  format:"a4"
 });

 const pageW = 297;
 const pageH = 210;

 const imgW = 250;
 const imgH = canvas.height * (imgW / canvas.width);

 const x = (pageW - imgW) / 2;
 const y = (pageH - imgH) / 2;

 pdf.addImage(img,"PNG",x,y,imgW,imgH);

 pdf.save("자리표.pdf");

}


/* 카운트다운 */

function startRandom(){

 let cd=document.getElementById("countdown");

 let n=3;

 cd.style.display="block";
 cd.textContent=n;

 let t=setInterval(()=>{

  n--;

  if(n===0){

   clearInterval(t);
   cd.style.display="none";

   assignSeats();

  }else{
   cd.textContent=n;
  }

 },1000);

}

</script>

</body>
</html>
