<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자리 바꾸기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body {
  margin: 0;
  padding: 30px 10px 60px;
  font-family: 'Gaegu', sans-serif;

  background-color: #f1e6d0; /* 교실 벽/바닥 느낌의 베이지 */

  display: flex;
  flex-direction: column;
  align-items: center;
}

#pageTitle {
  font-family: 'Jua', sans-serif;
  font-size: 32px;
  color: #f5f2e8;
  background: #35543f; /* 칠판 느낌의 진한 초록 */
  padding: 14px 34px;
  border-radius: 10px;
  border: 6px solid #7a5230; /* 나무 액자 느낌 */
  margin-bottom: 8px;
  letter-spacing: 2px;
}

#pageSub {
  font-family: 'Gaegu', sans-serif;
  font-size: 17px;
  color: #7a6248;
  margin: 10px 0 20px;
}

.btnRow {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  font-family: 'Jua', sans-serif;
  font-size: 17px;
  padding: 12px 24px;
  margin: 6px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: #fdf8ee;
  box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  transition: transform 0.08s ease;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.2);
}

button:nth-of-type(1) { background: #8a5a3b; } /* 나무 갈색 */
button:nth-of-type(2) { background: #4c7a5c; } /* 칠판 초록 */
button:nth-of-type(3) { background: #c9932f; } /* 분필 노랑 */

#boardWrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;

  background: #f8f1e0;
  border: 4px solid #b08a5f;
  border-radius: 18px;
  padding: 26px 24px;
  margin-top: 24px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}

/* 교탁 (교탁 위치는 flip 시 위/아래로 이동) */
#podium {
  order: 1;
  width: 260px;
  height: 46px;
  background: linear-gradient(#7a5230, #63421f);
  border: 3px solid #4d3016;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f5ead6;
  font-family: 'Jua', sans-serif;
  font-size: 16px;
  letter-spacing: 4px;
  box-shadow: 0 3px 0 #4d3016;
}

#board {
  order: 2;
  display: grid;

  grid-template-columns:
    96px 96px 40px
    96px 96px 40px
    96px 96px;

  grid-template-rows: repeat(5, 80px);

  gap: 12px;
}

#boardWrapper.flipped #podium { order: 2; }
#boardWrapper.flipped #board { order: 1; }

/* 책걸상 */
.seat {

  width: 96px;
  height: 80px;

  border: 3px solid #6b4a2f;
  border-radius: 6px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    repeating-linear-gradient(
      135deg,
      #c99a63,
      #c99a63 6px,
      #bd8b52 6px,
      #bd8b52 12px
    );

  box-shadow:
    inset 0 -14px 0 rgba(0,0,0,0.12), /* 의자 등받이 느낌 */
    0 3px 0 #4d3016;
}

.num {
  font-size: 21px;
  color: #4d3016;
  font-family: 'Gaegu', sans-serif;
  background: #fdf6e8;
  padding: 0 4px;
  border-radius: 4px;
}
.name {
  font-size: 21px;
  font-weight: bold;
  font-family: 'Jua', sans-serif;
  color: #3d2a17;
  text-shadow: 0 1px 0 #fdf6e8;
}

.empty {
  background: transparent;
  border: none;
  box-shadow: none;
}

#countdown {

  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 180px;
  font-weight: bold;
  font-family: 'Jua', sans-serif;
  color: #8a5a3b;
  text-shadow: 4px 4px 0 #f1e6d0;
  display: none;
}

/* PDF 캡처용 (평소엔 화면에 보이지 않음) */
#pdfTitle {
  display: none;
  font-family: 'Jua', sans-serif;
  font-size: 40px;
  color: #3d2a17;
  text-align: center;
  margin-top: 4px;
}

</style>
</head>

<body>

<div id="pageTitle">🏫 자리 바꾸기</div>
<div id="pageSub">오늘의 자리는 어디일까요? 📚✏️</div>

<div class="btnRow">
  <button onclick="startRandom()">🎲 랜덤 바꾸기</button>
  <button onclick="flipSeats()">🔄 자리표 변환</button>
  <button onclick="savePDF()">📄 저장</button>
</div>

<div id="boardWrapper">
  <div id="podium">교 탁</div>
  <div id="board"></div>
  <div id="pdfTitle">2-9 자리배치도</div>
</div>

<div id="countdown">3</div>

<script>


const students = [

{num:1,name:"가서한"},
{num:2,name:"강다솔"},
{num:3,name:"강채원"},
{num:4,name:"고윤솔"},
{num:5,name:"김소리"},
{num:6,name:"김수아"},
{num:7,name:"노윤서"},
{num:8,name:"문채은"},
{num:9,name:"박민영"},
{num:10,name:"박한을"},
{num:11,name:"배재은"},
{num:12,name:"신예은"},
{num:13,name:"엄수정"},
{num:14,name:"원태령"},
{num:15,name:"유진명"},
{num:16,name:"이서은"},
{num:17,name:"이은선"},
{num:18,name:"이해인"},
{num:19,name:"임서현"},
{num:20,name:"장시연"},
{num:21,name:"전은주"},
{num:22,name:"최소현"},
{num:23,name:"한나연"},
{num:24,name:"홍민서"}

];


const board = document.getElementById("board");
const boardWrapper = document.getElementById("boardWrapper");

let seats = [];
let originalSeats = new Array(30).fill(null);
let flippedState = false;


/* 자리 생성 */

for (let r=0;r<5;r++){
 for(let c=0;c<8;c++){

  let div=document.createElement("div");

  if(c===2||c===5){
    div.className="seat empty";
  }else{
    div.className="seat";
    seats.push(div);
  }

  board.appendChild(div);
 }
}


/* 섞기 */

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
}


/* 분단(좌/중/우) 구하기: 한 행당 6자리(0~5) 중 0,1=1분단 2,3=2분단 4,5=3분단 */
function getZone(index){
 return Math.floor((index % 6) / 2);
}


/* 그리기 */

function drawSeats(arr){

 seats.forEach((seat,i)=>{

  seat.innerHTML="";

  if(arr[i]){

   let num=document.createElement("div");
   num.className="num";
   num.textContent=arr[i].num;

   let name=document.createElement("div");
   name.className="name";
   name.textContent=arr[i].name;

   seat.appendChild(num);
   seat.appendChild(name);
  }

 });

}


/* 랜덤 (엄수정, 신예은은 같은 분단 배정 금지) */

function assignSeats(){

 let arr, result, idxA, idxB;
 let attempts = 0;

 do {

  arr=[...students];
  shuffle(arr);

  result=new Array(30).fill(null);

  for(let i=0;i<24;i++){
   result[i]=arr[i];
  }

  idxA = result.findIndex(s => s && s.name === "엄수정");
  idxB = result.findIndex(s => s && s.name === "신예은");

  attempts++;

 } while (idxA !== -1 && idxB !== -1 && getZone(idxA) === getZone(idxB) && attempts < 500);

 originalSeats=[...result];
 flippedState=false;
 boardWrapper.classList.remove("flipped"); // 랜덤 배정 시 교탁은 기본(상단) 위치

 drawSeats(result);
}


/* 반전 (좌석표뿐 아니라 교탁 위치도 함께 반전) */

function flipSeats(){

 if(!flippedState){

  let rev=[...originalSeats].reverse();
  drawSeats(rev);
  flippedState=true;
  boardWrapper.classList.add("flipped"); // 교탁 하단으로 이동

 }else{

  drawSeats(originalSeats);
  flippedState=false;
  boardWrapper.classList.remove("flipped"); // 교탁 상단으로 복귀

 }

}


/* PDF 저장 */

async function savePDF() {
  const wrapperEl = document.getElementById("boardWrapper");
  const titleEl = document.getElementById("pdfTitle");

  titleEl.style.display = "block";

  const canvas = await html2canvas(wrapperEl, { scale: 2, backgroundColor: "#ffffff" });

  titleEl.style.display = "none";

  // PDF A4 landscape
  const pdfW = 297;
  const pdfH = 210;

  // 캔버스 픽셀 크기
  const canvasW = canvas.width;
  const canvasH = canvas.height;

  // PDF에 맞게 비율 계산
  let ratio = Math.min(pdfW / canvasW, pdfH / canvasH);
  const imgW = canvasW * ratio;
  const imgH = canvasH * ratio;

  const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

  // 좌표 중앙 배치
  const x = (pdfW - imgW) / 2;
  const y = (pdfH - imgH) / 2;

  pdf.addImage(canvas.toDataURL("image/png"), "PNG", x, y, imgW, imgH);
  pdf.save("자리표.pdf");
}
  
/* 카운트다운 */

function startRandom(){

 let cd=document.getElementById("countdown");

 let n=3;

 cd.style.display="block";
 cd.textContent=n;

 let t=setInterval(()=>{

  n--;

  if(n===0){

   clearInterval(t);
   cd.style.display="none";

   assignSeats();

  }else{
   cd.textContent=n;
  }

 },1000);

}

</script>

</body>
</html>
